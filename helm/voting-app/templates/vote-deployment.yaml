apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: {{ .Values.images.vote }}
        name: vote
        ports:
        - containerPort: 80
          name: vote
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"


