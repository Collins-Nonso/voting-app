apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: 286841103747.dkr.ecr.eu-west-1.amazonaws.com/voting-app-result:latest
        name: result
        ports:
        - containerPort: 80
          name: result
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

